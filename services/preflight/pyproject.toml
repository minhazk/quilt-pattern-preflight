[project]
name = "quilt-preflight-service"
version = "0.1.0"
description = "Deterministic quilt-pattern extraction and arithmetic preflight service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.13",
  "pdfplumber==0.11.10",
  "pydantic==2.13.4",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "reportlab==5.0.0",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "hypothesis==6.163.0",
  "mypy==2.3.0",
  "pypdf==6.14.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"

[tool.coverage.run]
source = ["preflight_service"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
